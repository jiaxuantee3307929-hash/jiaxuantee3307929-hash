<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8fe5"/>
      <stop offset="50%" stop-color="#9b8cff"/>
      <stop offset="100%" stop-color="#72eaff"/>
    </linearGradient>
    <radialGradient id="node">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#a78bff"/>
      <stop offset="100%" stop-color="#5a4caa"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="190" rx="18" fill="#100d25"/>
  <g stroke="url(#line)" stroke-width="1.5" opacity=".65" fill="none">
    <path d="M80 95 L200 45 L340 95 L480 45 L620 95 L730 45"/>
    <path d="M80 95 L200 145 L340 95 L480 145 L620 95 L730 145"/>
    <path d="M200 45 L200 145 M340 95 L340 25 M480 45 L480 145 M620 95 L620 25"/>
    <path d="M80 95 L340 25 L620 25 L730 45"/>
  </g>

  <g fill="url(#node)" filter="url(#glow)">
    <circle cx="80" cy="95" r="7"/>
    <circle cx="200" cy="45" r="7"/>
    <circle cx="200" cy="145" r="7"/>
    <circle cx="340" cy="95" r="9"/>
    <circle cx="340" cy="25" r="5"/>
    <circle cx="480" cy="45" r="7"/>
    <circle cx="480" cy="145" r="7"/>
    <circle cx="620" cy="95" r="9"/>
    <circle cx="620" cy="25" r="5"/>
    <circle cx="730" cy="45" r="7"/>
    <circle cx="730" cy="145" r="7"/>
  </g>

  <g fill="#fff" font-family="monospace" font-size="11" text-anchor="middle">
    <text x="80" y="122">NETWORKS</text>
    <text x="200" y="25">AI</text>
    <text x="340" y="122">CYBERSECURITY</text>
    <text x="480" y="25">DATA</text>
    <text x="620" y="122">TECH</text>
  </g>

  <circle r="4" fill="#8be9ff" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M80 95 L200 45 L340 95 L480 45 L620 95 L730 45"/>
  </circle>
  <circle r="3" fill="#ffb7ed" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M730 145 L620 95 L480 145 L340 95 L200 145 L80 95"/>
  </circle>

  <text x="400" y="177" fill="#9d91d6" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="4">CONNECTING IDEAS · EXPLORING TECHNOLOGY</text>
</svg>
