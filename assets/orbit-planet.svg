<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#21134b"/>
      <stop offset="100%" stop-color="#080719"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f5baff"/>
      <stop offset="45%" stop-color="#9874ff"/>
      <stop offset="100%" stop-color="#29206e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb7ed"/>
      <stop offset="50%" stop-color="#8be9ff"/>
      <stop offset="100%" stop-color="#a58aff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="planetClip">
      <circle cx="150" cy="190" r="66"/>
    </clipPath>
  </defs>

  <rect width="300" height="400" rx="22" fill="url(#space)"/>

  <g fill="#fff">
    <circle cx="38" cy="55" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="245" cy="65" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="65" cy="150" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="220" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="48" cy="300" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="335" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="42" r="1.2"/>
    <circle cx="190" cy="90" r="1"/>
    <circle cx="95" cy="350" r="1.3"/>
  </g>

  <g fill="none" stroke="#9f8bff" opacity=".3">
    <circle cx="150" cy="190" r="105"/>
    <circle cx="150" cy="190" r="125"/>
  </g>

  <ellipse cx="150" cy="198" rx="112" ry="35" fill="none" stroke="url(#ring)" stroke-width="5"
           transform="rotate(-18 150 198)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="-18 150 198" to="342 150 198" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <circle cx="150" cy="190" r="66" fill="url(#planet)" filter="url(#glow)"/>
  <g clip-path="url(#planetClip)" opacity=".45" fill="none" stroke="#e7caff" stroke-width="8">
    <path d="M70 160 Q120 130 190 155"/>
    <path d="M80 190 Q140 165 225 190"/>
    <path d="M90 225 Q150 205 215 225"/>
  </g>

  <ellipse cx="150" cy="198" rx="112" ry="35" fill="none" stroke="#f5c4ff" stroke-width="2"
           transform="rotate(-18 150 198)" stroke-dasharray="90 240" opacity=".9">
    <animateTransform attributeName="transform" type="rotate" from="-18 150 198" to="342 150 198" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <circle cx="245" cy="175" r="7" fill="#8be9ff" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 150 190" to="360 150 190" dur="9s" repeatCount="indefinite"/>
  </circle>

  <text x="150" y="315" text-anchor="middle" fill="#f1d9ff" font-family="monospace" font-size="13" letter-spacing="3">LEARNING ORBIT</text>
  <text x="150" y="340" text-anchor="middle" fill="#9c91d9" font-family="monospace" font-size="9" letter-spacing="2">EXPLORE · LEARN · EVOLVE</text>
  <path d="M75 360 H225" stroke="#8066d9" opacity=".6"/>
  <circle cx="150" cy="360" r="3" fill="#8be9ff"/>
</svg>
