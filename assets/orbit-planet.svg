<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="320" viewBox="0 0 900 320">

  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#21134b"/>
      <stop offset="100%" stop-color="#080719"/>
    </radialGradient>

    <radialGradient id="planet" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f5baff"/>
      <stop offset="45%" stop-color="#9874ff"/>
      <stop offset="100%" stop-color="#29206e"/>
    </radialGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb7ed"/>
      <stop offset="50%" stop-color="#8be9ff"/>
      <stop offset="100%" stop-color="#a58aff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="planetClip">
      <circle cx="450" cy="145" r="66"/>
    </clipPath>
  </defs>

  <!-- Space Background -->
  <rect width="900" height="320" rx="22" fill="url(#space)"/>

  <!-- Twinkling Stars -->
  <g fill="#fff">
    <circle cx="55" cy="55" r="1.5">
      <animate attributeName="opacity" values=".2;1;.2"
               dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="220" r="2">
      <animate attributeName="opacity" values="1;.2;1"
               dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="65" r="1.4">
      <animate attributeName="opacity" values=".2;1;.2"
               dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="610" cy="45" r="2">
      <animate attributeName="opacity" values="1;.2;1"
               dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="230" r="1.5">
      <animate attributeName="opacity" values=".2;1;.2"
               dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="75" r="1.5">
      <animate attributeName="opacity" values="1;.2;1"
               dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="145" r="1.2"/>
    <circle cx="270" cy="270" r="1"/>
    <circle cx="680" cy="155" r="1.3"/>
    <circle cx="800" cy="285" r="1.3"/>
    <circle cx="390" cy="35" r="1.2"/>
    <circle cx="530" cy="275" r="1.2"/>
  </g>

  <!-- Distant Planetary Orbits -->
  <g fill="none" stroke="#9f8bff" opacity=".3">
    <circle cx="450" cy="145" r="105"/>
    <circle cx="450" cy="145" r="125"/>
  </g>

  <!-- Main Planet Orbit -->
  <ellipse cx="450" cy="145" rx="112" ry="35"
           fill="none" stroke="url(#ring)"
           stroke-width="5"
           transform="rotate(-18 450 145)"
           filter="url(#glow)">
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="-18 450 145"
                      to="342 450 145"
                      dur="18s"
                      repeatCount="indefinite"/>
  </ellipse>

  <!-- Planet -->
  <circle cx="450" cy="145" r="66"
          fill="url(#planet)" filter="url(#glow)"/>

  <!-- Planet Surface -->
  <g clip-path="url(#planetClip)"
     opacity=".45" fill="none"
     stroke="#e7caff" stroke-width="8">
    <path d="M370 115 Q420 85 490 110"/>
    <path d="M380 145 Q440 120 525 145"/>
    <path d="M390 180 Q450 160 515 180"/>
  </g>

  <!-- Front Orbit Ring -->
  <ellipse cx="450" cy="145" rx="112" ry="35"
           fill="none" stroke="#f5c4ff"
           stroke-width="2"
           transform="rotate(-18 450 145)"
           stroke-dasharray="90 240" opacity=".9">
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="-18 450 145"
                      to="342 450 145"
                      dur="18s"
                      repeatCount="indefinite"/>
  </ellipse>

  <!-- Orbiting Moon -->
  <circle cx="545" cy="130" r="7"
          fill="#8be9ff" filter="url(#glow)">
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0 450 145"
                      to="360 450 145"
                      dur="9s"
                      repeatCount="indefinite"/>
  </circle>

  <!-- Decorative Stars -->
  <g fill="#f5caff">
    <path d="M220 95 L224 106 L235 110 L224 114 L220 125 L216 114 L205 110 L216 106 Z"/>
    <path d="M690 80 L693 88 L701 91 L693 94 L690 102 L687 94 L679 91 L687 88 Z"/>
    <path d="M700 215 L703 223 L711 226 L703 229 L700 237 L697 229 L689 226 L697 223 Z"/>
  </g>

  <!-- Title -->
  <text x="450" y="260"
        text-anchor="middle"
        fill="#f1d9ff"
        font-family="monospace"
        font-size="17"
        letter-spacing="4">
    LEARNING ORBIT
  </text>

  <text x="450" y="283"
        text-anchor="middle"
        fill="#9c91d9"
        font-family="monospace"
        font-size="10"
        letter-spacing="3">
    EXPLORE · LEARN · EVOLVE
  </text>

  <!-- Bottom Decoration -->
  <path d="M330 300 H570"
        stroke="#8066d9" opacity=".6"/>
  <circle cx="450" cy="300" r="3" fill="#8be9ff"/>

</svg>
