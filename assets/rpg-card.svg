<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21143e"/>
      <stop offset="100%" stop-color="#10182f"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9ce8"/>
      <stop offset="50%" stop-color="#9b8cff"/>
      <stop offset="100%" stop-color="#79eaff"/>
    </linearGradient>
    <filter id="shine">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="300" height="400" rx="18" fill="url(#bg)"/>
  <rect x="8" y="8" width="284" height="384" rx="14" fill="none" stroke="url(#border)" stroke-width="2"/>
  <path d="M20 55 H280 M20 270 H280" stroke="#7466bb" opacity=".7"/>

  <text x="150" y="35" text-anchor="middle" fill="#f5c6ff" font-family="monospace" font-size="12" letter-spacing="3">PLAYER PROFILE</text>
  <text x="150" y="75" text-anchor="middle" fill="#8be9ff" font-family="monospace" font-size="10">LV. 01 · COMPUTER SCIENCE</text>

  <!-- Pixel character -->
  <g transform="translate(110 95)" shape-rendering="crispEdges">
    <rect x="20" y="0" width="40" height="10" fill="#30204e"/>
    <rect x="10" y="10" width="60" height="40" fill="#e7b4a6"/>
    <rect x="20" y="20" width="10" height="8" fill="#28203f"/>
    <rect x="50" y="20" width="10" height="8" fill="#28203f"/>
    <rect x="30" y="38" width="20" height="5" fill="#9e557d"/>
    <rect x="0" y="50" width="80" height="45" fill="#8c6de0"/>
    <rect x="10" y="55" width="60" height="35" fill="#b08cff"/>
    <rect x="20" y="95" width="15" height="25" fill="#25294e"/>
    <rect x="45" y="95" width="15" height="25" fill="#25294e"/>
    <rect x="10" y="120" width="25" height="8" fill="#8be9ff"/>
    <rect x="45" y="120" width="25" height="8" fill="#8be9ff"/>
    <rect x="0" y="60" width="10" height="28" fill="#e7b4a6"/>
    <rect x="70" y="60" width="10" height="28" fill="#e7b4a6"/>
    <animateTransform attributeName="transform" type="translate" values="110 95;110 91;110 95" dur="2s" repeatCount="indefinite"/>
  </g>

  <text x="150" y="250" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="17" font-weight="bold">TEE JIA XUAN</text>
  <text x="150" y="290" text-anchor="middle" fill="#ffb7ed" font-family="monospace" font-size="11">CURRENT QUESTS</text>

  <g font-family="monospace" font-size="10" fill="#d9d5ff">
    <text x="35" y="315">✦ CyberX · Multimedia Committee</text>
    <text x="35" y="337">✦ NALI 2026 · Event Interview</text>
    <text x="35" y="359">✦ PC Assembly · Hands-on Activity</text>
  </g>

  <text x="150" y="382" text-anchor="middle" fill="#8be9ff" font-family="monospace" font-size="9" letter-spacing="2">QUEST IN PROGRESS...</text>
  <circle cx="267" cy="35" r="4" fill="#8be9ff" filter="url(#shine)">
    <animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
